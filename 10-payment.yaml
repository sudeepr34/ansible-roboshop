- name: Payment setup
  hosts: payment
  become: true
  tasks:
    - name: Install Python build deps
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: [python3, gcc, python3-devel]

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
        create_home: true

    - name: Ensure /app directory
      ansible.builtin.file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop

    - name: Download payment artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip
        mode: "0644"

    - name: Unpack payment
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: /app/requirements.txt
        executable: pip3

    - name: Write payment environment file
      ansible.builtin.copy:
        dest: /etc/roboshop/payment.env
        mode: "0600"
        content: |
          CART_HOST={{ cart_host }}
          CART_PORT=8080
          USER_HOST={{ user_host }}
          USER_PORT=8080
          AMQP_HOST={{ rabbitmq_host }}
          AMQP_USER={{ rabbitmq_user }}
          AMQP_PASS={{ rabbitmq_password }}

    - name: Install payment systemd unit
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service
        mode: "0644"

    - name: Enable and start payment
      ansible.builtin.systemd:
        name: payment
        enabled: true
        state: restarted
        daemon_reload: true
