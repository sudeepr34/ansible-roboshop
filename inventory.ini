# Replace private IPs with your instances (or DNS names from 01-ec2-r53.yaml).
# Auth: SSH key via ansible.cfg (private_key_file). Do NOT commit passwords.

[local]
localhost ansible_connection=local

[frontend]
frontend.roboshop.internal

[mongodb]
mongodb.roboshop.internal

[redis]
redis.roboshop.internal

[mysql]
mysql.roboshop.internal

[rabbitmq]
rabbitmq.roboshop.internal

[catalogue]
catalogue.roboshop.internal

[user]
user.roboshop.internal

[cart]
cart.roboshop.internal

[shipping]
shipping.roboshop.internal

[payment]
payment.roboshop.internal

[all:vars]
ansible_user=ec2-user
# Prefer key-based auth. If you must use a password, keep it in an ansible-vault
# encrypted vars file — never in this inventory.
# ansible_ssh_private_key_file=~/.ssh/roboshop.pem
