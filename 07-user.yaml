- name: User setup
  hosts: user
  become: true
  tasks:
    - name: Disable default Node.js module
      ansible.builtin.command: dnf module disable nodejs -y
      changed_when: true

    - name: Enable Node.js 20
      ansible.builtin.command: dnf module enable nodejs:20 -y
      changed_when: true

    - name: Install Node.js
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
        create_home: true

    - name: Ensure /app directory
      ansible.builtin.file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop

    - name: Download user artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip
        mode: "0644"

    - name: Unpack user
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: Write user environment file
      ansible.builtin.copy:
        dest: /etc/roboshop/user.env
        mode: "0600"
        content: |
          MONGO=true
          REDIS_URL=redis://{{ redis_host }}:6379
          MONGO_URL=mongodb://{{ mongodb_host }}:27017/users

    - name: Install user systemd unit
      ansible.builtin.copy:
        src: user.service
        dest: /etc/systemd/system/user.service
        mode: "0644"

    - name: Enable and start user
      ansible.builtin.systemd:
        name: user
        enabled: true
        state: restarted
        daemon_reload: true
