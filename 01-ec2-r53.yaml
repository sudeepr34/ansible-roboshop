- name: Provision EC2 instances and Route53 records
  hosts: local
  connection: local
  gather_facts: false
  vars:
    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - frontend
  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        instance_type: "{{ instance_type }}"
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        tags:
          Name: "{{ item }}"
          Project: roboshop
      loop: "{{ instances }}"
      register: ec2_output

    - name: Create Route53 A record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 60
        value: "{{ item.instances[0].private_ip_address if item.item != 'frontend' else item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      loop_control:
        label: "{{ item.item }}"
