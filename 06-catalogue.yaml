- name: Catalogue setup
  hosts: catalogue
  become: true
  tasks:
    - name: Disable default Node.js module
      ansible.builtin.command: dnf module disable nodejs -y
      changed_when: true

    - name: Enable Node.js 20
      ansible.builtin.command: dnf module enable nodejs:20 -y
      changed_when: true

    - name: Install Node.js
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
        create_home: true

    - name: Ensure clean /app directory
      ansible.builtin.file:
        path: /app
        state: "{{ item }}"
        owner: roboshop
        group: roboshop
      loop: [absent, directory]

    - name: Download catalogue artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip
        mode: "0644"

    - name: Unpack catalogue
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: Write catalogue environment file
      ansible.builtin.copy:
        dest: /etc/roboshop/catalogue.env
        mode: "0600"
        content: |
          MONGO=true
          MONGO_URL=mongodb://{{ mongodb_host }}:27017/catalogue

    - name: Install catalogue systemd unit
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service
        mode: "0644"

    - name: Install MongoDB client repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
        mode: "0644"

    - name: Install mongosh
      ansible.builtin.package:
        name: mongodb-mongosh
        state: present

    - name: Check whether catalogue DB exists
      ansible.builtin.command: >
        mongosh {{ mongodb_host }} --quiet
        --eval "db.getMongo().getDBNames().indexOf('catalogue')"
      register: catalogue_db
      changed_when: false
      failed_when: false

    - name: Load catalogue master data
      ansible.builtin.shell: mongosh --host {{ mongodb_host }} </app/db/master-data.js
      when: (catalogue_db.stdout | default('-1') | int) < 0

    - name: Enable and start catalogue
      ansible.builtin.systemd:
        name: catalogue
        enabled: true
        state: restarted
        daemon_reload: true
