- name: Cart setup
  hosts: cart
  become: true
  tasks:
    - name: Disable default Node.js module
      ansible.builtin.command: dnf module disable nodejs -y
      changed_when: true

    - name: Enable Node.js 20
      ansible.builtin.command: dnf module enable nodejs:20 -y
      changed_when: true

    - name: Install Node.js
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
        create_home: true

    - name: Ensure /app directory
      ansible.builtin.file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop

    - name: Download cart artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
        dest: /tmp/cart.zip
        mode: "0644"

    - name: Unpack cart
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: Write cart environment file
      ansible.builtin.copy:
        dest: /etc/roboshop/cart.env
        mode: "0600"
        content: |
          REDIS_HOST={{ redis_host }}
          CATALOGUE_HOST={{ catalogue_host }}
          CATALOGUE_PORT=8080

    - name: Install cart systemd unit
      ansible.builtin.copy:
        src: cart.service
        dest: /etc/systemd/system/cart.service
        mode: "0644"

    - name: Enable and start cart
      ansible.builtin.systemd:
        name: cart
        enabled: true
        state: restarted
        daemon_reload: true
