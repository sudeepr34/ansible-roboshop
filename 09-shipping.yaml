- name: Shipping setup
  hosts: shipping
  become: true
  tasks:
    - name: Install Maven and MySQL client
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: [maven, mysql]

    - name: Install MySQL Python libraries
      ansible.builtin.pip:
        executable: pip3
        name: "{{ item }}"
      loop: [cryptography, PyMySQL]

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
        create_home: true

    - name: Ensure /app directory
      ansible.builtin.file:
        path: /app
        state: directory
        owner: roboshop
        group: roboshop

    - name: Download shipping artifact
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
        dest: /tmp/shipping.zip
        mode: "0644"

    - name: Unpack shipping
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: true
        owner: roboshop
        group: roboshop

    - name: Build shipping jar
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app
      changed_when: true

    - name: Install shipping jar
      ansible.builtin.copy:
        src: /app/target/shipping-1.0.jar
        dest: /app/shipping.jar
        remote_src: true
        mode: "0644"

    - name: Write shipping environment file
      ansible.builtin.copy:
        dest: /etc/roboshop/shipping.env
        mode: "0600"
        content: |
          CART_ENDPOINT={{ cart_host }}:8080
          DB_HOST={{ mysql_host }}

    - name: Install shipping systemd unit
      ansible.builtin.copy:
        src: shipping.service
        dest: /etc/systemd/system/shipping.service
        mode: "0644"

    - name: Import shipping SQL
      community.mysql.mysql_db:
        state: import
        name: all
        login_host: "{{ mysql_host }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        target: "{{ item }}"
      loop:
        - /app/db/schema.sql
        - /app/db/app-user.sql
        - /app/db/master-data.sql

    - name: Enable and start shipping
      ansible.builtin.systemd:
        name: shipping
        enabled: true
        state: restarted
        daemon_reload: true
